# Publishes HISAAB DO — the politics & public-money edition — into the `hisaab/` folder of the
# gh-pages branch, next to the JHK game that pages.yml publishes at the root:
#
#   https://<owner>.github.io/fact-duel/          Jaanta Hai Kya (pages.yml, from main)
#   https://<owner>.github.io/fact-duel/hisaab/   HISAAB DO (this workflow)
#
# It never force-pushes and never touches anything outside `hisaab/`: it checks out the current
# gh-pages tree, swaps that one folder, commits and pushes. pages.yml, in turn, carries `hisaab/`
# over when it rebuilds the root, so the two deploys can run in either order. Both share the
# `pages` concurrency group, so they queue rather than race.
#
# Solo and casual modes run in the browser. The separately deployed HISAAB Supabase service
# referees Online beta; the public endpoint is configuration, never a service-role credential.
name: Deploy HISAAB DO to Pages

on:
  push:
    branches: [main, claude/loving-pasteur-s8xwtf]
    paths:
      - 'editions/hisaab/**'
      - 'lib/**'
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'static/**'
      - 'vite.config.hisaab.ts'
      - 'scripts/hisaab-publication-theme.mjs'
      - 'scripts/hisaab-verify-artifact.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/**'
      - '.github/workflows/pages-hisaab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The edition lands in stages. Nothing is published until the lead marks the build releasable by
  # committing editions/hisaab/RELEASE (after the screens, reviews and fact-check pass are in), so a
  # half-built app is never live. Until then: say so and exit green rather than red.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Is the edition build in this tree?
        id: check
        run: |
          if [ -f vite.config.hisaab.ts ] && [ -f editions/hisaab/RELEASE ] && node -e 'process.exit(require("./package.json").scripts?.["build:hisaab"] ? 0 : 1)'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The HISAAB DO build is not in this tree yet — nothing to publish."
          fi

  build-and-publish:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types, run the suite and validate the bank
        run: |
          pnpm exec tsc --noEmit
          node --test tests/*.test.mjs
          node scripts/hisaab-validate.mjs
          node scripts/hisaab-publication-theme.mjs --check

      - name: Build the edition
        env:
          HISAAB_BASE: /${{ github.event.repository.name }}/hisaab/
          VITE_HISAAB_SERVER_URL: https://wvupsqfevlrmhqfjreyx.supabase.co/functions/v1/hisaab-game
        run: |
          pnpm build:hisaab
          test -f dist-hisaab/index.html
          node scripts/hisaab-verify-artifact.mjs dist-hisaab --base="$HISAAB_BASE"
          touch dist-hisaab/.nojekyll
          du -sh dist-hisaab

      # Swap only hisaab/ inside the live gh-pages tree. A plain push (no --force) that retries on
      # a moved branch: if pages.yml published in between, rebase onto it and try again.
      - name: Publish into gh-pages/hisaab/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            rm -rf _pages
            if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
              git clone -q --depth 1 --branch gh-pages "$remote" _pages
            else
              mkdir _pages && git -C _pages init -q && git -C _pages checkout -q -b gh-pages
              touch _pages/.nojekyll
            fi
            rm -rf _pages/hisaab
            mkdir -p _pages/hisaab
            cp -r dist-hisaab/. _pages/hisaab/
            cd _pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing changed in hisaab/."; exit 0
            fi
            git commit -q -m "Publish HISAAB DO from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
            if git push -q "$remote" HEAD:gh-pages; then
              echo "Published: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/hisaab/"
              exit 0
            fi
            cd ..
            echo "gh-pages moved; retrying (${attempt})"; sleep $((attempt * 5))
          done
          echo "Could not publish after 4 attempts." >&2
          exit 1
