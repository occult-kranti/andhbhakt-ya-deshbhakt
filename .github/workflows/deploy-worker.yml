# Historical optional deployment; current game beta uses Pages + Supabase. Never runs on a push.
# Deploys the SERVER build — the Worker with the D1-backed duel, wallet, ledger, accounts and ops
# routes — to Cloudflare Workers. This is the deployment that carries the founder's own domain, and
# the one AdSense reviews; the static GitHub Pages build (pages.yml) has no server — it is the
# in-browser preview until the repository variable APP_URL points at this Worker, after which it
# serves a hand-off card and the quiz pages only. See docs/deploy-cloudflare.md, "What runs where".
#
# What happens, in order:
#   1. `pnpm build` writes dist/server/wrangler.json (name = package name, D1 = placeholder id).
#   2. `pnpm deploy:prepare` writes dist/server/wrangler.deploy.json next to it with the real
#      Worker name, database id and Custom Domain — from deploy.config.json at the repo root, which
#      repository variables of the same name override. The generated file is never edited in place.
#   3. Migrations run BEFORE the new code goes live, so no request ever meets a table it needs and
#      cannot find. Every migration in drizzle/ is additive; wrangler tracks what it has applied in
#      the d1_migrations table and re-running is a no-op.
#   4. `wrangler deploy` uploads the Worker and the static assets.
#   5. Each secret that is set in the repository is pushed with `wrangler secret put`. An unset
#      secret is skipped and the Worker's existing value (if any) is kept. Secrets are never
#      written into a config file or echoed into the log.
#
# Like sweep.yml: an unconfigured repository exits 0 with a message that names what is missing.
# A workflow that is permanently red gets ignored, and this is the one that ships the money layer.
#
# Required repository SECRETS:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — and nothing else.
# Required repository VARIABLES: none. deploy.config.json carries the Worker name and the database.
# Optional VARIABLES:            CF_D1_DATABASE_ID, CF_WORKER_NAME, CF_D1_DATABASE_NAME — each
#                                overrides the file — and CF_CUSTOM_DOMAIN (e.g. play.example.com)
# Optional SECRETS (Worker env): OPS_TOKEN, SESSION_SECRET, GOOGLE_CLIENT_ID, MAIL_API_KEY,
#                                MAIL_FROM, APP_ORIGIN — see cloudflare-env.d.ts for what each does.
name: Legacy Cloudflare deployment (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a half-finished deploy (migrations may be mid-flight); queue instead.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  # The `secrets` context is not available in a job-level `if` (nor in a step's), so a first job
  # turns "is this configured?" into an output the deploy job can gate on. It may be read in a
  # step's `env:`, which is how the two flags below are computed without printing either value.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # deploy.config.json is what makes the database id a repo fact rather than a repo variable,
      # so preflight needs the tree to see it.
      - uses: actions/checkout@v4

      - name: Check the deployment is configured
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          set -uo pipefail
          # The database id comes from the repository variable when it is set, otherwise from the
          # committed deploy.config.json. Either one satisfies the requirement — but what counts is
          # the VALUE, not the filename. A file that exists and carries no `d1.id` (stripped to {}
          # to re-point a staging copy, or hand-edited into invalid JSON) is NOT configured, and
          # saying so here is the green exit. Calling it configured only moves the failure ten
          # minutes downstream, into a red deploy after install, typecheck, suite and build.
          file_id=""
          if [ -f deploy.config.json ]; then
            file_id=$(node -e 'try{const v=require("./deploy.config.json")?.d1?.id;process.stdout.write(typeof v==="string"?v.trim():"")}catch{}')
          fi
          if [ -n "${CF_D1_DATABASE_ID:-}" ]; then
            database_source="vars.CF_D1_DATABASE_ID"
          elif [ -n "${file_id}" ]; then
            database_source="deploy.config.json"
          else
            database_source=""
          fi
          if [ "${HAS_TOKEN}" = "true" ] && [ "${HAS_ACCOUNT}" = "true" ] && [ -n "${database_source}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Configured. Database id from ${database_source}."
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deployment is not configured yet — nothing to do."
          echo "Two repository secrets are all it takes (Settings > Secrets and variables > Actions):"
          [ "${HAS_TOKEN}" = "true" ]   && token_state=present   || token_state=MISSING
          [ "${HAS_ACCOUNT}" = "true" ] && account_state=present || account_state=MISSING
          echo "  secrets.CLOUDFLARE_API_TOKEN  : ${token_state}"
          echo "  secrets.CLOUDFLARE_ACCOUNT_ID : ${account_state}"
          if [ -z "${database_source}" ] && [ -f deploy.config.json ]; then
            echo "The database id is missing too: deploy.config.json carries no d1.id (or does not parse)."
            echo "Put the uuid back under \"d1\": { \"id\": … } or set vars.CF_D1_DATABASE_ID."
          elif [ -z "${database_source}" ]; then
            echo "The database id is missing too: restore deploy.config.json or set vars.CF_D1_DATABASE_ID."
          fi
          echo
          echo "How to get both, in ten minutes: docs/deploy-cloudflare.md, the \"Ten-minute path\"."

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      DEPLOY_CONFIG: dist/server/wrangler.deploy.json
      # The optional Worker secrets, mapped here and nowhere else. GitHub does NOT expose the
      # `secrets` context to a step's `if:` — only to `env:` and to expressions inside a job's
      # env, so `if: ${{ secrets.OPS_TOKEN != '' }}` is not a condition that evaluates false, it
      # is a parse error that fails the whole workflow before any job starts (an instant red run
      # with zero jobs, on every push). Mapping each one to an env var here makes the same test
      # legal as `if: env.OPS_TOKEN != ''`. Values stay masked; nothing below echoes one.
      OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and run the suite
        run: |
          pnpm exec tsc --noEmit
          node --test tests/*.test.mjs

      # The crawlable /quiz/* pages, with their canonical URLs on the founder's domain when there
      # is one (unset SITE_BASE means the generator's default, the GitHub Pages mirror).
      - name: Generate the crawlable quiz pages from the served bank
        env:
          CF_CUSTOM_DOMAIN: ${{ vars.CF_CUSTOM_DOMAIN }}
        run: |
          if [ -n "${CF_CUSTOM_DOMAIN:-}" ]; then
            SITE_BASE="https://${CF_CUSTOM_DOMAIN}" pnpm seo:pages
          else
            pnpm seo:pages
          fi

      - name: Build the Worker
        run: pnpm build

      # Also writes dist/client/.assetsignore so public/product/ (7.6 MB of internal documentation,
      # including the compliance checklist pages.yml deliberately never publishes) stays off the
      # domain. The check afterwards is the release gate for that file, not the ignore rule.
      # Each variable below is optional and overrides deploy.config.json; unset means the file wins.
      - name: Prepare the deploy manifest
        env:
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_CUSTOM_DOMAIN: ${{ vars.CF_CUSTOM_DOMAIN }}
        run: |
          set -uo pipefail
          pnpm deploy:prepare
          echo "Assets excluded from upload (dist/client/.assetsignore):"
          cat dist/client/.assetsignore
          # wrangler's summary counts files before ignores; only its debug log names what it skips.
          WRANGLER_LOG=debug pnpm exec wrangler deploy --dry-run --config "${DEPLOY_CONFIG}" > dry-run.log 2>&1 \
            || { tail -40 dry-run.log; echo "::error::wrangler dry run failed."; exit 1; }
          checklist=product/compliance/checklist.site.html
          if [ -e "dist/client/${checklist}" ] && ! grep -qxF "Ignoring asset: ${checklist}" dry-run.log; then
            echo "::error::The compliance checklist would be uploaded (no 'Ignoring asset: ${checklist}' in the dry run). Refusing to deploy."
            exit 1
          fi
          echo "Ignored under product/: $(grep -c '^Ignoring asset: product/' dry-run.log) entries."
          grep -E '^(Total Upload|.*Read [0-9]+ files from the assets directory)' dry-run.log || true

      # Additive migrations first, then code: a request that lands during the deploy finds every
      # table it was written against. wrangler records applied migrations in d1_migrations.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config "${DEPLOY_CONFIG}"

      - name: Deploy the Worker
        run: pnpm exec wrangler deploy --config "${DEPLOY_CONFIG}"

      # One step per secret, each skipped when the repository does not set it — the test is on the
      # job-level env var above, because a step's `if:` cannot see the `secrets` context at all.
      # The value goes to wrangler over stdin (never an argument, so it is not in `ps` or the log),
      # and the repo's copy stays the source of truth: change it in Settings and re-run this
      # workflow. An unset secret interpolates to the empty string, so the step simply does not run.
      - name: Set OPS_TOKEN
        if: env.OPS_TOKEN != ''
        run: printf '%s' "${OPS_TOKEN}" | pnpm exec wrangler secret put OPS_TOKEN --config "${DEPLOY_CONFIG}"

      - name: Set SESSION_SECRET
        if: env.SESSION_SECRET != ''
        run: printf '%s' "${SESSION_SECRET}" | pnpm exec wrangler secret put SESSION_SECRET --config "${DEPLOY_CONFIG}"

      - name: Set GOOGLE_CLIENT_ID
        if: env.GOOGLE_CLIENT_ID != ''
        run: printf '%s' "${GOOGLE_CLIENT_ID}" | pnpm exec wrangler secret put GOOGLE_CLIENT_ID --config "${DEPLOY_CONFIG}"

      - name: Set MAIL_API_KEY
        if: env.MAIL_API_KEY != ''
        run: printf '%s' "${MAIL_API_KEY}" | pnpm exec wrangler secret put MAIL_API_KEY --config "${DEPLOY_CONFIG}"

      - name: Set MAIL_FROM
        if: env.MAIL_FROM != ''
        run: printf '%s' "${MAIL_FROM}" | pnpm exec wrangler secret put MAIL_FROM --config "${DEPLOY_CONFIG}"

      - name: Set APP_ORIGIN
        if: env.APP_ORIGIN != ''
        run: printf '%s' "${APP_ORIGIN}" | pnpm exec wrangler secret put APP_ORIGIN --config "${DEPLOY_CONFIG}"

      - name: Where it went
        env:
          CF_CUSTOM_DOMAIN: ${{ vars.CF_CUSTOM_DOMAIN }}
        run: |
          set -uo pipefail
          # Read the name back out of the manifest `pnpm deploy:prepare` wrote earlier in this same
          # job — the one wrangler just deployed. Re-deriving it from vars.CF_WORKER_NAME would be
          # blind to deploy.config.json's workerName, and the founder is told to copy this URL into
          # APP_URL: a guessed name here is a hand-off card pointing every visitor at a dead host.
          name=$(node -p "require(require('node:path').resolve(process.env.DEPLOY_CONFIG)).name" 2>/dev/null) || name=""
          if [ -n "${CF_CUSTOM_DOMAIN:-}" ]; then
            echo "Deployed Worker '${name:-see the deploy output above}'."
            echo "  live at https://${CF_CUSTOM_DOMAIN}/ (once the Custom Domain has provisioned)"
          elif [ -n "${name}" ]; then
            echo "Deployed Worker '${name}'."
            echo "  live at https://${name}.<your-subdomain>.workers.dev/ — the exact URL is in the"
            echo "  deploy output above. Set the repository variable APP_URL to it so the GitHub"
            echo "  Pages build hands players over to this one."
          else
            echo "Deployed. ${DEPLOY_CONFIG} could not be read back, so the Worker name is not"
            echo "  repeated here: take the workers.dev URL from the deploy output above. Set the"
            echo "  repository variable APP_URL to it so the GitHub Pages build hands players over."
          fi
          echo "Verify the ops door: POST /api/ops answers 503 with no OPS_TOKEN set on the Worker,"
          echo "401 with a wrong bearer token, 200 with the right one. See docs/money-runbook.md."
