name: Deploy Andhbhakt ya Deshbhakt
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source
        env:
          PGLITE_MODULE_PATH: ${{ github.workspace }}/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          pnpm exec tsc --noEmit
          node --test tests/*.test.mjs
          node scripts/hisaab-validate.mjs
      - name: Build game
        env:
          HISAAB_BASE: /andhbhakt-ya-deshbhakt/
          VITE_HISAAB_SERVER_URL: https://wvupsqfevlrmhqfjreyx.supabase.co/functions/v1/hisaab-game
        run: |
          pnpm build:hisaab
          node scripts/hisaab-verify-artifact.mjs dist-hisaab --base="$HISAAB_BASE"
          touch dist-hisaab/.nojekyll
          node scripts/beta-build-manifest.mjs dist-hisaab
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-hisaab
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
